    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c3d1c8"/><stop offset=".5" stop-color="#f7f8f0"/><stop offset="1" stop-color="#a7bdb0"/></linearGradient>
