<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Учебная лаборатория: найдите безопасные и опасные ситуации</title>
  <desc id="scene-desc">Условная изометрическая лаборатория с рабочим столом, принтером, микроволновой печью, электрической плиткой и чайником. У чайника повреждён шнур, два мощных прибора подключены через один тройник, коробки частично перекрывают дверь выхода. Вентиляционные отверстия принтера открыты, середина прохода свободна, настенная розетка целая. Это учебная иллюстрация, а не план здания.</desc>
